---
- name: Create PostgreSQL data directory
  ansible.builtin.file:
    path: "{{ postgres_data_path }}"
    state: directory
    mode: "0755"

- name: Create Odoo compose directory
  ansible.builtin.file:
    path: /opt/odoo
    state: directory
    mode: "0755"

- name: Deploy Odoo docker-compose
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: /opt/odoo/docker-compose.yml
    owner: root
    group: root
    mode: "0600"

- name: Start Odoo stack
  community.docker.docker_compose_v2:
    project_src: /opt/odoo
    state: present
    pull: missing

- name: Check that Odoo answers
  ansible.builtin.uri:
    url: "http://localhost:{{ odoo_port }}/web/login"
    status_code: 200
  register: odoo_check
  retries: 20
  delay: 6
  until: odoo_check.status == 200