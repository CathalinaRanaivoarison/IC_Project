---
# L'utilisateur interne de pgAdmin a l'UID 5050 : il doit posséder ses fichiers.
- name: Create pgAdmin data directory
  ansible.builtin.file:
    path: "{{ pgadmin_data_path }}"
    state: directory
    owner: "5050"
    group: "5050"
    mode: "0755"

- name: Create pgAdmin compose directory
  ansible.builtin.file:
    path: /opt/pgadmin
    state: directory
    mode: "0755"

- name: Deploy pgAdmin servers configuration
  ansible.builtin.template:
    src: servers.json.j2
    dest: "{{ servers_file_path }}"
    owner: "5050"
    group: "5050"
    mode: "0644"

- name: Deploy pgpass file
  ansible.builtin.template:
    src: pgpass.j2
    dest: "{{ pgpass_file_path }}"
    owner: "5050"
    group: "5050"
    mode: "0600"
  no_log: true

- name: Deploy pgAdmin docker-compose
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: /opt/pgadmin/docker-compose.yml
    owner: root
    group: root
    mode: "0600"

- name: Start pgAdmin
  community.docker.docker_compose_v2:
    project_src: /opt/pgadmin
    state: present
    pull: missing

- name: Check that pgAdmin answers
  ansible.builtin.uri:
    url: "http://localhost:{{ pgadmin_port }}/misc/ping"
    status_code: 200
  register: pgadmin_check
  retries: 20
  delay: 6
  until: pgadmin_check.status == 200