---
- name: Configuration initiale et installation de Docker
  hosts: serveur_2, serveur_3
  become: true
  tasks:
    - name: Mettre à jour le cache apt
      apt:
        update_cache: yes
        force_apt_get: yes

    - name: Installer les prérequis
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - software-properties-common
        state: present

    - name: Créer le répertoire keyrings
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Ajouter la clé GPG Docker
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Ajouter le dépôt Docker
      apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present

    - name: Installer Docker Engine
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present
        update_cache: yes

    - name: Démarrer Docker
      service:
        name: docker
        state: started
        enabled: yes

    - name: Ajouter l'utilisateur 'ubuntu' au groupe docker
      user:
        name: ubuntu
        groups: docker
        append: yes

    - name: Réinitialiser la connexion SSH
      meta: reset_connection