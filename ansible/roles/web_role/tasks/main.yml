---
- name: Create application directory
  ansible.builtin.file:
    path: /opt/ic-webapp
    state: directory
    mode: "0755"

- name: Copy application Docker Compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: /opt/ic-webapp/docker-compose.yml
    mode: "0644"

- name: Start web application
  community.docker.docker_compose_v2:
    project_src: /opt/ic-webapp
    state: present
    pull: always

- name: Check that the web application answers
  ansible.builtin.uri:
    url: "http://localhost:{{ web_host_port }}/"
    return_content: true
  register: web_check
  retries: 10
  delay: 5
  until: web_check.status == 200

- name: Check that both URLs are present in the page
  ansible.builtin.assert:
    that:
      - odoo_url in web_check.content
      - pgadmin_url in web_check.content