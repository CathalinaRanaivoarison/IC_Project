---
# Noms des services (dans le docker-compose)
odoo_service_name: "odoo"
postgres_service_name: "postgres"

# Noms des conteneurs
odoo_container_name: "odoo-web"
postgres_container_name: "odoo-db"

# Réseau et volumes
odoo_network_name: "odoo_network"
odoo_volume_name: "odoo_data"
postgres_volume_name: "postgres_data"

# Répertoire local où la base est stockée (modifiable par l'utilisateur)
postgres_data_path: "/opt/postgres_data"

# Port publié
odoo_port: 8069

# Images
odoo_image: "odoo:17"
postgres_image: "postgres:15"

# Base de données
postgres_db: "postgres"
postgres_user: "odoo"
postgres_password: "{{ vault_postgres_password }}"